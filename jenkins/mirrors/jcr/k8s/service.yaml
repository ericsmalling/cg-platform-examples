apiVersion: v1
kind: Service
metadata:
  name: jcr
  namespace: mirror-jcr
  labels:
    app.kubernetes.io/name: jcr
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jcr
  ports:
    # Web UI / REST API. Host port 8082 via kind extraPortMappings.
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
      protocol: TCP
    # Docker connector — JCR addresses Docker repos by path on its single
    # HTTP port (8082). We expose the same containerPort under a second
    # NodePort so users can use either host port; clients pull from
    # localhost:5054/<repo>/<image>:<tag>. Host port 5054 via kind
    # extraPortMappings.
    - name: docker
      port: 5054
      targetPort: 8082
      nodePort: 30054
      protocol: TCP
