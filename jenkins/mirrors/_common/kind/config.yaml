kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Mirror cgr.dev to the in-cluster cgr-oidc-proxy. The proxy runs with
# hostNetwork: true on port 5000, so containerd reaches it on 127.0.0.1
# from each node. The proxy injects a short-lived OIDC-derived bearer on
# every outbound request to cgr.dev, replacing the old long-lived pull
# token. Mirror is bootstrapped at cluster create time; containerd retries
# the endpoint until the proxy Deployment becomes ready.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."cgr.dev"]
      endpoint = ["http://127.0.0.1:5000"]
nodes:
- role: control-plane
  extraPortMappings:
  # Harbor (via ingress-nginx).
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # distribution proxy registry.
  - containerPort: 30050
    hostPort: 5050
    protocol: TCP
  # distribution hosted registry.
  - containerPort: 30051
    hostPort: 5051
    protocol: TCP
  # zot (single instance handles both pull-through sync and hosted).
  - containerPort: 30052
    hostPort: 5052
    protocol: TCP
  # Nexus CE — pull port (cgr-proxy) on 5053, push port (library) on 5060,
  # UI on 8081. CE doesn't support writable group repos so pull and push
  # need separate Docker connectors.
  - containerPort: 30053
    hostPort: 5053
    protocol: TCP
  - containerPort: 30060
    hostPort: 5060
    protocol: TCP
  - containerPort: 30081
    hostPort: 8081
    protocol: TCP
  # JCR — docker repos on 5054, UI on 8082.
  - containerPort: 30054
    hostPort: 5054
    protocol: TCP
  - containerPort: 30082
    hostPort: 8082
    protocol: TCP
