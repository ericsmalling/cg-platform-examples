apiVersion: v1
kind: Service
metadata:
  name: nexus-ce
  namespace: mirror-nexus-ce
  labels:
    app.kubernetes.io/name: nexus-ce
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nexus-ce
  ports:
    # Web UI / REST API. Host port 8081 via kind extraPortMappings.
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
      protocol: TCP
    # Docker connector for the cgr-proxy repo (pull-through). Host 5053.
    - name: docker-pull
      port: 5053
      targetPort: 5053
      nodePort: 30053
      protocol: TCP
    # Docker connector for the library hosted repo (push). Host 5060.
    # CE lacks writable group repos so pull and push use separate ports.
    - name: docker-push
      port: 5060
      targetPort: 5060
      nodePort: 30060
      protocol: TCP
