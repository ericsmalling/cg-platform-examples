apiVersion: v1
kind: ConfigMap
metadata:
  name: distribution-proxy-config
  namespace: mirror-distribution
  labels:
    app: distribution-proxy
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: false
      cache:
        blobdescriptor: inmemory
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
    proxy:
      remoteurl: http://cgr-oidc-proxy.cgr-oidc-proxy.svc.cluster.local:5000
      # No username/password: the cgr-oidc-proxy injects the OIDC-derived
      # bearer itself on every outbound request to cgr.dev.
