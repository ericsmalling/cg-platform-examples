apiVersion: v1
kind: ConfigMap
metadata:
  name: distribution-hosted-config
  namespace: mirror-distribution
  labels:
    app: distribution-hosted
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
      cache:
        blobdescriptor: inmemory
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
    # No proxy: section — this is a regular hosted registry.
    # No auth: section — anonymous read+write for the demo.
